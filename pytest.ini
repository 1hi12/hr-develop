[pytest]
testpaths = tests
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::RuntimeWarning:asyncpg
    ignore::ResourceWarning

# Marqueurs pour séparer les types de tests
markers =
    unit: Tests unitaires avec mocks — aucune DB
    integration: Tests intégration sur cv_db_test uniquement
    uat: Tests UAT complets
    performance: Tests de performance
    calibration: Tests de précision AIScorer — vrai LLM, scores à valider par un humain (tests/calibration/)

# Ignorer les dossiers non-test
norecursedirs =
    .git
    __pycache__
    .venv
    venv
    node_modules
    frontend
    static
    alembic
